<figure class="diagram">
  <div class="diagram__viewport" role="region" tabindex="0" aria-label="Where the funds go, scrollable diagram">
    <svg viewBox="0 0 760 236" role="img" aria-label="Funds move from the depositor's wallet into the escrow contract and out to the receiver's wallet. The Hokan API only hands unsigned transactions to the wallets; it is never on the path the money takes.">
    <defs>
      <marker id="dg-arrow-custody" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <polygon class="dg-arrow" points="0,0 8,4 0,8"></polygon>
      </marker>
      <marker id="dg-arrow-custody-quiet" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <polygon class="dg-arrow--quiet" points="0,0 8,4 0,8"></polygon>
      </marker>
    </defs>

    <!-- Hokan, off to the side of the value path -->
    <rect class="dg-surface--quiet" x="295" y="0" width="170" height="52" rx="6"></rect>
    <text class="dg-label" x="380" y="24" text-anchor="middle">Hokan API</text>
    <text class="dg-note" x="380" y="40" text-anchor="middle">holds no keys</text>

    <path class="dg-line--quiet" d="M380 52 V82 H85 V112" marker-end="url(#dg-arrow-custody-quiet)"></path>
    <path class="dg-line--quiet" d="M380 52 V82 H675 V112" marker-end="url(#dg-arrow-custody-quiet)"></path>
    <text class="dg-note" x="392" y="70">unsigned transaction · you sign it</text>

    <!-- the value path -->
    <rect class="dg-surface" x="0" y="118" width="170" height="64" rx="6"></rect>
    <text class="dg-label" x="85" y="146" text-anchor="middle">Depositor wallet</text>
    <text class="dg-note" x="85" y="164" text-anchor="middle">their keys</text>

    <rect class="dg-surface--accent" x="295" y="118" width="170" height="64" rx="6"></rect>
    <text class="dg-label" x="380" y="146" text-anchor="middle">Escrow contract</text>
    <text class="dg-note--accent" x="380" y="164" text-anchor="middle">validator address</text>

    <rect class="dg-surface" x="590" y="118" width="170" height="64" rx="6"></rect>
    <text class="dg-label" x="675" y="146" text-anchor="middle">Receiver wallet</text>
    <text class="dg-note" x="675" y="164" text-anchor="middle">signs nothing</text>

    <line class="dg-line" x1="170" y1="150" x2="286" y2="150" marker-end="url(#dg-arrow-custody)"></line>
    <text class="dg-note" x="228" y="142" text-anchor="middle">funds</text>

    <line class="dg-line" x1="465" y1="150" x2="581" y2="150" marker-end="url(#dg-arrow-custody)"></line>
    <text class="dg-note" x="523" y="142" text-anchor="middle">release</text>

    <line class="dg-line--quiet" x1="0" y1="206" x2="760" y2="206"></line>
    <text class="dg-note" x="0" y="228">No Hokan wallet appears anywhere on this line.</text>
    </svg>
  </div>
  <figcaption>The money never passes through us. We build the transaction; the wallet that owns the funds signs it, and the contract releases to the receiver.</figcaption>
</figure>
